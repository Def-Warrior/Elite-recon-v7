[metadata]
name = elite-recon
version = 7.0.0
description = OWASP 2025 Bug Bounty Reconnaissance Framework
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
keywords = security, bug-bounty, recon, owasp, penetration-testing

[options]
python_requires = >=3.8
install_requires = file: requirements.txt

[tool:pytest]
testpaths = tests
python_files = test_*.py

[flake8]
max-line-length = 100
exclude = .git,__pycache__,dist,build,*.egg-info
